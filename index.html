<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🪐 Planet Shop — 3D магазин</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== ФОН (ЗВЁЗДЫ) ===== -->
    <div class="stars" id="stars"></div>

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <a href="#">
                        <span class="logo-icon">🪐</span>
                        <span class="logo-text">PLANET <span class="logo-highlight">SHOP</span></span>
                    </a>
                </div>
                <div class="header-search">
                    <form onsubmit="searchProducts(event)">
                        <input type="text" placeholder="Поиск по галактике..." id="searchInput">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </form>
                </div>
                <div class="header-actions">
                    <a href="admin.html" class="admin-link" title="Админ-панель">🌌</a>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== ГЛАВНАЯ ===== -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>🪐 <span class="highlight">Космический</span> магазин</h1>
                <p>Вращай планеты и выбирай товары</p>
            </div>
        </div>
    </section>

    <!-- ===== 3D СЦЕНА ===== -->
    <section class="scene-container">
        <div class="container">
            <div class="scene-wrapper" id="sceneWrapper">
                <!-- Three.js сцена будет здесь -->
                <div id="threeContainer"></div>
                
                <!-- Навигация по планетам (кнопки влево/вправо) -->
                <button class="nav-btn prev" id="prevBtn" onclick="changePlanet(-1)">‹</button>
                <button class="nav-btn next" id="nextBtn" onclick="changePlanet(1)">›</button>
                
                <!-- Индикатор текущей планеты -->
                <div class="planet-indicator" id="planetIndicator"></div>
            </div>
        </div>
    </section>

    <!-- ===== МОДАЛЬНОЕ ОКНО ТОВАРА ===== -->
    <div class="product-modal" id="productModal">
        <div class="modal-overlay" onclick="closeProductModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeProductModal()">✕</button>
            
            <div class="modal-planet-preview" id="modalPlanetPreview">
                <!-- Мини-планета будет здесь -->
            </div>
            
            <div class="modal-info">
                <h2 id="modalName"></h2>
                <div class="modal-category" id="modalCategory"></div>
                <div class="modal-price" id="modalPrice"></div>
                <div class="modal-old-price" id="modalOldPrice"></div>
                <p id="modalDesc" class="modal-desc"></p>
                <div class="modal-stock" id="modalStock"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
